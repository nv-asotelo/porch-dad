# porch-dad bridge configuration.
#
# num_frames is capped by max_frames because the Cosmos3-Edge visual engine is built with
# max_image_tokens: 1024 and each frame costs ~302 prompt tokens at the current 320-token
# per-image cap. Measured: 1 frame = 329 tok, 2 = 631, 3 = 933, 4 = REJECTED by the runtime.
# Raising num_frames above 3 requires rebuilding the visual engine with a larger
# max_image_tokens, not just editing this value.

# JetPack's bundled ffmpeg is a stripped decode-only NVIDIA build with no scale filter and no
# software encoders, so frame extraction needs a full build (see nvr/README.md).
ffmpeg: "/usr/local/bin/ffmpeg-full"
ffprobe: "/usr/local/bin/ffprobe-full"

frigate_url: "http://127.0.0.1:5000"
# Used for the "clip" link handed to your phone, so it must be reachable from the phone,
# not from the Jetson.
frigate_public_url: "http://<jetson-ip>:5000"
cosmos3_url: "http://127.0.0.1:8000"

mqtt_host: "127.0.0.1"
mqtt_port: 1883
mqtt_topic: "frigate/events"

db_path: "/home/orin/nvr/bridge/events.db"
web_host: "0.0.0.0"
web_port: 8095

num_frames: 3
max_frames: 3
max_tokens: 512
frame_width: 640          # 640x480 lands at ~300 image tokens, just under the 320 cap
clip_wait_seconds: 3.0    # Frigate finalizes the clip shortly after the event ends

# Restrict to specific Frigate camera names; empty list means all cameras.
cameras: []

# Frigate camera keys cannot contain spaces; this maps them to the friendly name substituted
# into {camera} in the user prompt.
camera_labels:
  front_door: "Front Door"


system_prompt: |
  You are an automated residential security monitoring system. Your primary goal is to identify potential security threats, unexpected visitors, and localized hazards.

  CRITICAL INSTRUCTIONS:
  - Completely ignore harmless environmental noise (e.g., wind blowing trees, changing shadows, rain, or small passing wildlife like birds or squirrels).
  - Treat delivery drivers leaving packages normally as 'Routine Activities' unless they exhibit suspicious behavior.
  - Flag any of the following as high-priority anomalies: human loitering, individuals attempting to obscure their faces, unauthorized entry into backyards/windows, or visible smoke/fire.

  FORMATTING:
  Respond ONLY in plain text. Begin every observation with a timestamp bracket in [MM:SS] format. Categorize the event as [ROUTINE] or [ALERT].

# {num_frames} and {stream_id} are substituted per the spec. {camera} is also available so the
# same template works for more than one camera; it defaults to the Frigate camera name.
user_prompt: |
  Review these {num_frames} sampled frames from the home security camera '{camera}' (Stream ID: {stream_id}).
  Is there any human activity or hazard present? If yes, describe the person's actions, appearance, and what objects they are interacting with. If no activity is present, respond with 'No activity detected'. Keep the output small, as if a text message is being sent.

# --- Ring event source -------------------------------------------------------------------------
# Ring's live stream cannot be used as a continuous NVR feed (verified: ffmpeg reports "Invalid
# data found when processing input" even while ring-mqtt reports the WebRTC session connected), and
# holding it open would drain battery cameras. Ring is event-driven, so the bridge consumes
# motion/ding events plus the JPEG snapshots ring-mqtt publishes. Works for wired and battery alike.
#
# Note: no Ring subscription tier exposes a persistent local RTSP stream. Ring's paid 24/7
# Continuous Recording records to Ring's cloud for the Ring app; it does not change this API.
ring_enabled: true
ring_snapshot_window: 8.0    # seconds to gather snapshots after an event fires
ring_cooldown: 45.0          # per-camera, prevents one busy camera flooding the feed

ring_cameras:
  "90486cee0ffc": "Front Door"
  "ac9fc327c838": "Office"
  "343ea4e653f3": "Front entryway"
  "cc3bfb1999ad": "Pinky"
  "343ea4e422a6": "Front Driveway"
  "9c7613a0ec61": "2nd floor patio"
  "649a631f4214": "2nd floor driveway"
