name: nvr

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  ring-mqtt:
    image: tsightler/ring-mqtt:latest
    container_name: ring-mqtt
    restart: unless-stopped
    mem_limit: 700m
    depends_on:
      - mosquitto
    ports:
      - "8554:8554"     # RTSP (bundled go2rtc) - Frigate consumes these
      - "55123:55123"   # setup web UI - Ring account auth happens HERE
    volumes:
      - ./ring-mqtt/data:/data
    # /tmp as tmpfs so it cannot survive a restart. scripts/start-stream.sh guards each camera
    # with /tmp/ring-mqtt-<deviceid>_<type>.lock and, if that file already exists, exits 1
    # SILENTLY - no log line, nothing in go2rtc beyond error="streams: exec/rtsp". Kill the
    # container mid-stream (reboot, shutdown, SIGKILL) and the lock is left behind in the
    # writable layer, where `docker restart` preserves it. Every later attempt then dies on a
    # lock nothing owns, and the affected cameras are down permanently while ring-mqtt itself
    # looks perfectly healthy: authenticated, publishing snapshots, streams present in
    # go2rtc.yaml. Diagnosed exactly that way on 2026-09-25 - two locks dated Sep 18 16:5x,
    # left by the shutdown during the SD clone, had front_entryway and front_driveway dark for
    # a week. Only a container *recreate* cleared them before this.
    # 64m is ~150x the 424 KB actually used, and bounded matters on an 8 GB board.
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      - MQTTURL=mqtt://mosquitto:1883
      - DEBUG=ring-*

  # Moorebot Scout camera -> MJPEG, plus a drive relay. Measured at 37 MB RSS and 0.3% CPU.
  #
  # NOT started by `docker compose up`: the profile means it only runs when asked for explicitly,
  # with `docker compose --profile scout up -d scout-bridge`. That is deliberate on a board with a
  # few hundred MB free - and matches how the Reachy camera ships disabled. Turning it on is a
  # decision, not a side effect of bringing the NVR up.
  #
  # Build it first: docker compose --profile scout build scout-bridge
  scout-bridge:
    profiles: ["scout"]
    build: ./scout
    image: porch-scout-bridge:latest
    container_name: scout-bridge
    restart: unless-stopped
    mem_limit: 128m
    # host networking is REQUIRED, not a shortcut. ROS1 is peer-to-peer after the initial
    # handshake: the master calls back to this node's XML-RPC server, and the robot's MotorNode
    # opens an inbound TCPROS connection to whatever ephemeral port our /cmd_vel publisher chose.
    # Neither address is known in advance, so there is no set of `ports:` that would work. ROS_IP
    # must be the address the ROBOT can reach this Jetson on, or it will advertise a container
    # address the robot cannot route to and the camera will connect but never deliver frames.
    network_mode: host
    environment:
      - ROS_MASTER_URI=http://192.168.7.6:11311     # the Scout
      - ROS_IP=192.168.6.252                        # this Jetson, as the robot sees it
    # REQUIRED, and confirmed against the robot rather than guessed. The Scout's firmware pins no
    # ROS_IP/ROS_HOSTNAME, so its master advertises every node by HOSTNAME:
    #     master getUri        -> http://linaro-alip:11311/
    #     requestTopic /jpg    -> ['TCPROS', 'linaro-alip', 50218]
    # rospy uses those strings verbatim and nothing here resolves "linaro-alip", so without this
    # line the bridge fails with socket.gaierror and never receives a frame. Tested both ways in
    # this exact image: without it, name resolution error; with it, frames immediately.
    #
    # The two addresses look like different subnets and are not - both hosts carry a /22, so
    # 192.168.6.252 and 192.168.7.6 share 192.168.4.0/22 and route directly.
    extra_hosts:
      - "linaro-alip:192.168.7.6"
    # Binds the docker gateway rather than 0.0.0.0 so the robot's camera stays off the LAN while
    # still being reachable from Frigate's bridged container as host.docker.internal.
    command: ["--listen", "172.17.0.1", "--listen-port", "8098", "--fps", "12"]

  # Second Scout: the tracked model on the first floor (192.168.7.7). Identical firmware to the
  # robot-room Scout - same roller_eye stack, same topics, same cmd_vel convention - so it uses the
  # same image and only its address changes. Both robots answer to the SAME hostname (linaro-alip):
  # each bridge pins that name to ITS robot via extra_hosts, so the two never cross even though the
  # string collides. Port 8100 keeps it clear of the robot-room bridge on 8098.
  scout-bridge-first-floor:
    profiles: ["scout"]
    build: ./scout
    image: porch-scout-bridge:latest
    container_name: scout-bridge-first-floor
    restart: unless-stopped
    mem_limit: 128m
    network_mode: host
    environment:
      - ROS_MASTER_URI=http://192.168.7.7:11311     # the first-floor Scout
      - ROS_IP=192.168.6.252                        # this Jetson, as the robot sees it
    extra_hosts:
      - "linaro-alip:192.168.7.7"
    command: ["--listen", "172.17.0.1", "--listen-port", "8100", "--fps", "12"]

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    # Hard cap: the Cosmos3-Edge model holds ~3.8GB of this board's 8GB. A container OOM here is
    # recoverable; a host OOM would take the model down with it.
    mem_limit: 1900m
    shm_size: 128m
    # Lets Frigate's GenAI reach the Cosmos3-Edge shim, which listens on the host rather than
    # in a container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mosquitto
    ports:
      - "5000:5000"     # Frigate UI + API (the bridge reads event clips from here)
      - "8971:8971"     # authenticated UI
    volumes:
      - ./frigate/config:/config
      - ./frigate/media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 256000000
    environment:
      - FRIGATE_RTSP_PASSWORD=change_me
      # Without this the container runs UTC and the burned-in clock reads 7 hours ahead of the
      # wall clock, which is actively misleading on a security timestamp.
      - TZ=America/Los_Angeles
