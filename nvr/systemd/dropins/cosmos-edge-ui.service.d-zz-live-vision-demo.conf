# Drop-in for cosmos-edge-ui.service
#   install to /etc/systemd/system/cosmos-edge-ui.service.d/zz-live-vision-demo.conf,
#   with <reachy-ip> replaced by the robot's LAN address (nvr/README.md, "Live Vision")
#
# Turns on Live Vision's Reachy Mini control and speech. --reachy-daemon-url is the robot daemon's
# own REST API (motors, pose, apps, volume, sound), not its camera: video and audio still come from
# reachy-mjpeg-bridge, relayed under /reachy/ with or without this file. --piper-* is speech through
# the robot's speaker; serve_ui.py refuses it without --reachy-daemon-url.
#
# --engine-link/--engines-config turn on its model buttons: the engines in
# /home/orin/nvr/ui/config/engines.json (nvr/ui/config/engines.orin.json), switched by relinking
# the shim's engine and restarting the shim, which restarts porch-dad with it (Requires=). Needs
# sudo for exactly those command lines (nvr/ui/config/sudoers-live-vision-engines). Its
# "kind": "classifier" entries are the Pokemon and dog-breed classifiers on pokemon-classifier.service
# (--classifier-url, nvr/classifier/README.md), which leave the shim alone; each --samples-dir is a
# labelled sample set the page can run them over, one tab each (this Orin adds its private
# doggy-daycare spot set, nvr/classifier/make_spot_set.py, as a second one after the Pokemon set:
# /home/orin/nvr/classifier/samples-daycare), and --services-config adds that service to the
# page's status bar. --luma-url adds the VITURE Luma Ultra source: the glasses' camera on the Orin's
# USB-C port, through nvr/luma/luma_camera_bridge.py (systemd/luma-camera-bridge.service).
# --demo-mode-script is the page's Demo mode button (nvr/demo-mode.sh), which also
# lets a model marked "needs_demo_mode" load after the page warns that the NVR will stop.
#
# Layered on lan.conf, which nvr/ui/scripts/enable_lan_ui.sh writes along with the TLS cert. Both
# reset ExecStart=, systemd applies drop-ins in file-name order, and the last command wins: "zz-"
# sorts after "lan.conf". A numeric prefix (20-, 90-) sorts before it, and then lan.conf's command,
# which has no robot or speech flags, wins silently - the UI just hides those panels. The listener
# flags are repeated because a reset replaces the whole command, so change ports here: re-running
# enable_lan_ui.sh with other ports has no effect while this file exists.
#
# MemoryMax: the unit caps this UI at 256M so it never competes with the shim. Piper is a child of
# serve_ui.py, so it runs in this cgroup: measured at 105-135 MB RSS there, and with the UI itself
# that is more than 256M, which the kernel enforces by OOM-killing inside the unit. 1G is a ceiling,
# not a reservation, but it is above the board's ~800 MB of headroom (nvr/README.md), so this cap
# alone no longer protects the shim from a runaway UI.
[Service]
MemoryMax=1G
ExecStart=
ExecStart=/home/orin/TensorRT-Edge-LLM/.venv/bin/python /home/orin/nvr/ui/scripts/serve_ui.py --host 0.0.0.0 --port 8092 --allow-insecure-lan --https-port 8443 --cert /home/orin/nvr/ui/deployment/tls/orin.crt --key /home/orin/nvr/ui/deployment/tls/orin.key --reachy-daemon-url http://<reachy-ip>:8000 --piper-bin /home/orin/nvr/piper/piper --piper-model /home/orin/nvr/piper/en_US-ljspeech-medium.onnx --engine-link /opt/tensorrt-edgellm/models/default --engines-config /home/orin/nvr/ui/config/engines.json --classifier-url http://127.0.0.1:8094 --luma-url http://127.0.0.1:8103 --samples-dir /home/orin/nvr/classifier/samples --services-config /home/orin/nvr/ui/config/services.json --demo-mode-script /home/orin/nvr/demo-mode.sh
