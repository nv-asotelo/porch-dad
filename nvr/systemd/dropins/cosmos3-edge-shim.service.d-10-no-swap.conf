# Drop-in for cosmos3-edge-shim.service
#   install to /etc/systemd/system/cosmos3-edge-shim.service.d/10-no-swap.conf
#
# The engine is ~3.8 GB resident. Under memory pressure the kernel pages parts of it out to the
# disk-backed swapfile, and every inference touching those pages faults them back in - stalling the
# WebUI for seconds at a time. That reads as "the WebUI is crashing", but the process never exits:
# measured NRestarts=0 across 2.5 hours of it, with zero errors in its log.
#
# Measured: 566 MB of the model sat in swap while the board had 90 MB of free RAM.
# Model weights are exactly the wrong thing to page out, so this cgroup may not use swap at all.
[Service]
MemorySwapMax=0
