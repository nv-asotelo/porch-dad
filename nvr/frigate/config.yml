# Declared so Frigate skips its config migration. Without this key Frigate re-migrates on
# every start, and that migration rewrites the file - it moves genai.cosmos into
# objects.genai as a YAML alias and discards the entire prompt block, leaving Frigate in
# safe mode with no cameras.
version: 0.18-0

# Frigate config for Jetson Orin Nano Super (8 GB), JetPack 7 / L4T R39.
#
# Platform facts that shape this file:
#
# 1. Orin Nano has NO hardware encoder. NVIDIA states that "the Jetson Orin Nano does not have the
#    NVENC engine" and directs users to software libx264. So recordings use stream copy and
#    birdseye is disabled - anything that re-encodes costs CPU we do not have.
#
# 2. Docker here has only the `runc` runtime - no nvidia container runtime - and Frigate has no
#    official JetPack 7.2 build (onnxruntime-gpu has no prebuilt Orin wheel for CUDA 13.2, and the
#    classic TensorRT detector was removed in JP7). Detection therefore runs on CPU. That is a
#    deliberate choice: GPU detection would contend with Cosmos3-Edge for the GPU and for the
#    scarce 8 GB, and the detector only has to TRIGGER an event - the scene understanding is done
#    by Cosmos3-Edge via the genai block below.
#
# CPU is the binding constraint. Two 2624x1472 Ring streams already consume ~4 of 6 cores at
# 5 fps detect. Check `docker stats` and `uptime` before enabling more cameras.

mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  topic_prefix: frigate
  client_id: frigate

detectors:
  cpu1:
    type: cpu

birdseye:
  enabled: false

logger:
  default: info
  logs:
    # Reveals "Sending N images ...", which is the only way to see how many frames GenAI packs
    # into a request - and that count is what overruns the engine's max_input_len.
    frigate.genai: debug

record:
  enabled: true
  # Frigate 0.18 schema: record.retain{days,mode} was replaced by continuous/motion/alerts/
  # detections. Because this file pins `version:` (to stop the migration rewriting the genai
  # prompts), it must be written in 0.18-native schema - migration will not fix it for us.
  continuous:
    days: 0            # no 24/7 retention; disk is ample but CPU/IO is not
  motion:
    days: 3
  alerts:
    retain:
      days: 14
  detections:
    retain:
      days: 14

snapshots:
  enabled: true
  # timestamp_style only defines how the clock LOOKS; each consumer has to opt in. Without this the
  # overlay never appears on snapshots - which are exactly what gets attached to phone
  # notifications, so this is the one that matters.
  timestamp: true
  bounding_box: true
  retain:
    default: 14

# ---------------------------------------------------------------------------------------------
# GenAI provider: Frigate captions its own events using the LOCAL Cosmos3-Edge shim.
# The shim is OpenAI-compatible, so provider: openai + a custom base_url keeps everything on the
# LAN with no external API. host.docker.internal resolves to the Jetson via the extra_hosts entry
# in docker-compose.yml, because the shim listens on the host rather than in a container.
#
# Timestamps come from Frigate, which stamps every event itself. The prompts deliberately do NOT
# ask the model to produce one: it cannot know the wall clock, and when asked it emitted
# meaningless values ([04:55:17]) and once the literal placeholder "[MM:SS]".
genai:
  cosmos:
    provider: openai
    base_url: http://host.docker.internal:8000/v1
    api_key: "none"
    model: cosmos3-edge
    provider_options:
      # The engine's hard input ceiling. Frigate was sending 1866 tokens against max_input_len 1536.
      context_size: 1536
    roles:
      - descriptions

# Burned-in clock. This is what puts a time on the live view, on snapshots, and therefore on the
# image attached to phone notifications - so a notification carries its own timestamp even if the
# message text does not. `format` is strftime, and strftime passes literal characters through, which
# is how the camera name gets prefixed per-camera below.
timestamp_style:
  position: tl
  format: "%a %d %b %Y  %H:%M:%S"
  color:
    red: 255
    green: 255
    blue: 255
  thickness: 2
  effect: shadow      # keeps it readable over bright driveway concrete

objects:
  track:
    - person
    - car
    - truck
    # Wildlife. NOTE: the CPU detector uses a COCO model, which has NO class for deer, raccoon,
    # coyote or squirrel. Frigate can only trigger on the classes below - a deer often trips
    # "horse"/"cow"/"sheep", and a squirrel may trip "cat" or nothing at all. That is acceptable
    # here: Frigate only needs to fire the event, and Cosmos3-Edge names the actual species.
    - bird
    - cat
    - dog
    - bear
    - horse
    - cow
    - sheep

  genai:
    enabled: true
    # MUST stay true on this engine. With use_snapshot: false Frigate sends a *sequence* of
    # thumbnails, and the runtime rejects it:
    #   EDGELLM_INPUT_TOO_LONG: expanded multimodal input length 2609 exceeds the engine's
    #   maxPositionEmbeddings 2048
    # Each image costs ~302 prompt tokens, so a multi-frame sequence plus the prompt overruns the
    # 2048-token position limit and every genai call fails silently (descriptions stay null).
    # One snapshot lands near ~500 tokens total. Raising this needs an engine rebuild with a larger
    # maxInputLen, not a config change.
    use_snapshot: true
    objects:
      - person
      - car
      - truck
      - bird
      - cat
      - dog
      - bear
      - horse
      - cow
      - sheep
    # Tuned by hill-climbing against real frames from these cameras. Findings:
    #  - A structured template (GATE:/HAZARD:/...) makes this 4B model ECHO the template
    #    back verbatim instead of filling it in. Do not use field-style output.
    #  - Prompts under ~25 words cause hallucination (it invented an open gate that does
    #    not exist), so keep the instruction explicit.
    #  - Telling it 'never state what is absent' degraded output to 'No, no, no.'
    #  - GATE LANGUAGE IS DELIBERATELY ABSENT HERE. Asked about gates the model answers
    #    CLOSED 5/5 even on a camera with no gate in frame, so a global gate instruction
    #    only produces false readings. Gate handling lives on front_driveway only.
    prompt: >-
      Look at home camera '{camera}' and describe only what is visible, in one or two short
      sentences: people (what they are doing, wearing and carrying), animals (name the species
      as specifically as you can), vehicles, and whether exterior lamps are lit. Report visible
      smoke, fire or flames first if present. Ignore sunlight, shadows, weather and moving
      foliage.
    object_prompts:
      person: >-
        Look at home camera '{camera}'. In one or two short sentences describe the person: what
        they are doing, what they are wearing, and what they are carrying. Describe only what is
        visible. Say so explicitly if they are loitering, covering their face, climbing a fence
        or window, or forcing a door. Report smoke or fire first if present.
      bird: >-
        Look at home camera '{camera}'. Name the animal's species as specifically as you can
        (deer, raccoon, coyote, squirrel, skunk, fox, bird, cat, dog) and say what it is doing,
        in one short sentence. Report smoke or fire first if present.
      cat: >-
        Look at home camera '{camera}'. Name the animal's species as specifically as you can
        (deer, raccoon, coyote, squirrel, skunk, fox, bird, cat, dog) and say what it is doing,
        in one short sentence. Report smoke or fire first if present.
      dog: >-
        Look at home camera '{camera}'. Name the animal's species as specifically as you can
        (deer, raccoon, coyote, squirrel, skunk, fox, bird, cat, dog) and say what it is doing,
        in one short sentence. Report smoke or fire first if present.
      bear: >-
        Look at home camera '{camera}'. Name the animal's species as specifically as you can
        (deer, raccoon, coyote, squirrel, skunk, fox, bird, cat, dog) and say what it is doing,
        in one short sentence. Report smoke or fire first if present.
      horse: >-
        Look at home camera '{camera}'. Name the animal's species as specifically as you can
        (deer, raccoon, coyote, squirrel, skunk, fox, bird, cat, dog) and say what it is doing,
        in one short sentence. Report smoke or fire first if present.
      cow: >-
        Look at home camera '{camera}'. Name the animal's species as specifically as you can
        (deer, raccoon, coyote, squirrel, skunk, fox, bird, cat, dog) and say what it is doing,
        in one short sentence. Report smoke or fire first if present.
      sheep: >-
        Look at home camera '{camera}'. Name the animal's species as specifically as you can
        (deer, raccoon, coyote, squirrel, skunk, fox, bird, cat, dog) and say what it is doing,
        in one short sentence. Report smoke or fire first if present.

review:
  genai:
    # Disabled: review summaries pack many thumbnails into one request (measured ~1866 tokens),
    # which overruns the visual engine's max_image_tokens: 1024 and its max_input_len: 1536. Object
    # descriptions send a single snapshot (~240 tokens) and fit comfortably, so review GenAI was
    # starving the feature that actually matters. Re-enable only after rebuilding the engine with a
    # larger max_image_tokens/--maxInputLen.
    enabled: false
    alerts: true
    detections: true
    additional_concerns:
      - visible smoke, fire, flames or a growing glow anywhere in frame
      - a person loitering with no clear purpose
      - a person concealing or covering their face
      - a person climbing a fence, wall or window, or forcing a door
      - an unfamiliar animal on the property
      - a gate left open
      - exterior lights switching on or off unexpectedly

cameras:
  # MOTION GATING (the DeepStream/VSS principle: gate inference cheaply, do not run the detector on
  # everything). These views are full of vegetation, and wind was keeping motion ON across four
  # cameras at once, starving a shared CPU detector already at ~116ms/inference. contour_area is
  # raised so leaf-scale movement is ignored, and threshold raised so subtle luminance shifts
  # (shadows, cloud) do not trigger. This enforces "ignore trees, wind and shadows" at the cheap
  # layer instead of asking the VLM to do it.
  #
  # DETECT FPS is split by importance: primary cameras 4fps, secondary 2fps. Total demand must stay
  # under detector capacity (~8.6 inferences/sec at 116ms), or every camera starves and real people
  # go undetected - which is exactly what happened at 6 cameras x 5fps = 30fps demanded.
  # Ring streams work ONLY with the ?video query. Without it ffmpeg fails with "Invalid data found
  # when processing input", because ring-mqtt's go2rtc advertises two competing audio codecs
  # (default_query: video&audio=aac&audio=opus) and the negotiation breaks the parse.
  #
  # POWER NOTE: continuous detect holds each RTSP stream open permanently, which drains battery-
  # powered Ring cameras. Operator has accepted that tradeoff here. The binding constraint is
  # instead RESOURCES: with all six streaming, Frigate reached 1.557GiB of its cap and the host fell
  # to ~1GB free, alongside a model holding ~3.3GB.
  #
  # CPU WARNING: these streams are 2624x1472. Decode is on CPU (Docker here has no nvidia runtime),
  # so each enabled camera is expensive. Enable a few, run `docker stats` and `uptime`, and only
  # then add more.

  front_door:
    # Disabled: this camera fails to stream even with ?video ("Invalid data found when processing
    # input") and separately times out on ring-mqtt snapshot retrieval, so it has a genuine
    # connectivity problem rather than a config one. Left here documented; re-enable once the
    # camera itself is healthy.
    enabled: false          # lpd_v4 doorbell - wired (transformer)
    ffmpeg:
      inputs:
        - path: rtsp://ring-mqtt:8554/90486cee0ffc_live?video
          input_args: preset-rtsp-generic
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 2
    motion:
      threshold: 40
      contour_area: 40
    record:
      enabled: true
    snapshots:
      enabled: true
    timestamp_style:
      format: "FRONT DOOR  %a %d %b  %H:%M:%S"

  front_entryway:
    enabled: true          # stickup_cam_longfin - CHECK POWER
    ffmpeg:
      inputs:
        - path: rtsp://ring-mqtt:8554/343ea4e653f3_live?video
          input_args: preset-rtsp-generic
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 4
    motion:
      threshold: 40
      contour_area: 40
    record:
      enabled: true
    snapshots:
      enabled: true
    timestamp_style:
      format: "FRONT ENTRYWAY  %a %d %b  %H:%M:%S"

  front_driveway:
    enabled: true          # stickup_cam_longfin - CHECK POWER
    ffmpeg:
      inputs:
        - path: rtsp://ring-mqtt:8554/343ea4e422a6_live?video
          input_args: preset-rtsp-generic
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 4
    motion:
      threshold: 40
      contour_area: 40
    record:
      enabled: true
    snapshots:
      enabled: true
    timestamp_style:
      format: "FRONT DRIVEWAY  %a %d %b  %H:%M:%S"

  office:
    # df_doorbell_clownfish. Probed healthy: h264 480x480 (square doorbell aspect). Detect matches
    # the native geometry, so there is no downscale cost - far cheaper than the 2624x1472 cameras.
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://ring-mqtt:8554/ac9fc327c838_live?video
          input_args: preset-rtsp-generic
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 480
      height: 480
      fps: 4
    motion:
      threshold: 40
      contour_area: 30
    record:
      enabled: true
    snapshots:
      enabled: true
    timestamp_style:
      format: "OFFICE DOORBELL  %a %d %b  %H:%M:%S"

  pinky:
    enabled: true          # cocoa_camera_v2 - likely BATTERY
    ffmpeg:
      inputs:
        - path: rtsp://ring-mqtt:8554/cc3bfb1999ad_live?video
          input_args: preset-rtsp-generic
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 2
    motion:
      threshold: 45
      contour_area: 60
    record:
      enabled: true
    snapshots:
      enabled: true
    timestamp_style:
      format: "PINKY  %a %d %b  %H:%M:%S"

  patio_2nd_floor:
    enabled: true          # cocoa_camera - likely BATTERY
    ffmpeg:
      inputs:
        - path: rtsp://ring-mqtt:8554/9c7613a0ec61_live?video
          input_args: preset-rtsp-generic
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 2
    motion:
      threshold: 45
      contour_area: 60
    record:
      enabled: true
    snapshots:
      enabled: true
    timestamp_style:
      format: "2ND FLOOR PATIO  %a %d %b  %H:%M:%S"

  driveway_2nd_floor:
    enabled: true          # cocoa_camera - likely BATTERY
    ffmpeg:
      inputs:
        - path: rtsp://ring-mqtt:8554/649a631f4214_live?video
          input_args: preset-rtsp-generic
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 2
    motion:
      threshold: 45
      contour_area: 60
    record:
      enabled: true
    snapshots:
      enabled: true
    timestamp_style:
      format: "2ND FLOOR DRIVEWAY  %a %d %b  %H:%M:%S"
