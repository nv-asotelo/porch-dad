# Frigate config for Jetson Orin Nano Super (8 GB), JetPack 7 / L4T R39.
#
# Two platform facts shape this file:
#
# 1. Orin Nano has NO hardware encoder. NVIDIA states plainly that "the Jetson Orin Nano does not
#    have the NVENC engine" and directs users to software (libx264) encoding. Anything that
#    re-encodes therefore costs CPU, so recordings use stream copy and birdseye is disabled.
#
# 2. Docker here has only the `runc` runtime registered - no nvidia container runtime - and
#    Frigate's TensorRT detector images target JetPack 6 (l4t r36) against a CUDA 13.2 host.
#    So this uses the stock arm64 image with the CPU detector. That is a deliberate choice, not
#    an oversight: object detection only has to be good enough to *trigger* an event, because the
#    actual scene understanding is done by Cosmos3-Edge downstream.
#
# RAM is the binding constraint (the model holds ~3.8 GB of 8 GB), so detect runs at low
# resolution and low fps. Raise detect fps/resolution only after checking `free -m`.

mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  topic_prefix: frigate
  client_id: frigate

detectors:
  cpu1:
    type: cpu

# Re-encodes a composite stream; pointless CPU cost on a board with no hardware encoder.
birdseye:
  enabled: false

logger:
  default: info

record:
  enabled: true
  # Stream copy - never re-encode on this board.
  alerts:
    retain:
      days: 14
  detections:
    retain:
      days: 14

  continuous:
    days: 0
  motion:
    days: 3
snapshots:
  enabled: true
  bounding_box: true
  retain:
    default: 14

objects:
  track:
    - person
    - car
    - dog
    - cat

# Keep clips short: the bridge samples 3 frames per event, and short clips make those frames
# far more representative of what actually happened.
cameras:
  # Ring cameras are exposed by ring-mqtt's bundled go2rtc at ring-mqtt:8554 (same compose network).
  #
  # WARNING - only point Frigate at WIRED cameras. Frigate's continuous detect holds the RTSP
  # stream open permanently, which drains a battery-powered Ring camera in hours and hammers Ring's
  # cloud. Front Door is an lpd_v4 (Doorbell Pro), which is transformer-powered.
  # For battery cameras use ring-mqtt's motion/ding MQTT events instead of a continuous stream.
  #
  # Discovered device IDs:
  #   Office              ac9fc327c838      Front entryway      343ea4e653f3
  #   Front Door          90486cee0ffc      Pinky               cc3bfb1999ad
  #   Front Driveway      343ea4e422a6      2nd floor patio     9c7613a0ec61
  #   2nd floor driveway  649a631f4214
  front_door:
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://ring-mqtt:8554/90486cee0ffc_live
          input_args: preset-rtsp-generic
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    motion:
      threshold: 30
      contour_area: 15
    record:
      enabled: true
    snapshots:
      enabled: true
version: 0.18-0
