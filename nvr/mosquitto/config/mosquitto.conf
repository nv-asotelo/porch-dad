# Local-network broker for Frigate <-> ring-mqtt <-> Cosmos3-Edge bridge.
# Anonymous access is intentional for a trusted LAN; see README for locking it down.
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type error
max_queued_messages 500
